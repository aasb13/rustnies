[package]
name = "rustnies"
version = "0.1.0"
edition = "2024"
description = "rustnies VPN - phase 1: a reliable, modular UDP tunnel"

[lib]
name = "rustnies"
path = "src/lib.rs"

[[bin]]
name = "rustnies"
path = "src/main.rs"

[dependencies]
bytes = { version = "1.12", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1.53", features = ["full"] }
tokio-stream = "0.1"
tun-rs = { version = "2.8", features = ["async_tokio"] }

# Crypto: standard, audited primitives + a Noise IK handshake implemented
# faithfully against the Noise spec (no invented cryptography).
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

# CLI / observability
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-appender = "0.2"
bitflags = "2.6"
thiserror = "2.0"
hex = "0.4"
rtnetlink = { version = "0.14", default-features = false, features = ["tokio_socket"] }
netlink-packet-route = { version = "0.19", default-features = false }
netlink-sys = { version = "0.8", default-features = false }
futures = { version = "0.3", default-features = false }
ipnet = { version = "2", default-features = false }
netlink-packet-core = "0.7"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
