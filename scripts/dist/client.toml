# rustnies client configuration.
#
# Installed by scripts/install.sh (stock copy refreshed to *.toml.dist).
# `server` and `server_key` MUST be set before the client can connect.
# Edit this file, then (re)start the service.

# The server's UDP endpoint.
server = "127.0.0.1:46722"

# The server's static public key (64 hex chars). On the server run
# `rustnies pubkey --key /var/lib/rustnies/server.key` (or read its .pub
# sidecar) to get this value, then paste it here. For a remote server, use
# that server's public key.
server_key = "REPLACE_WITH_SERVER_PUBKEY_HEX"

# Client long-term static key (created by `keygen` if absent).
key_path = "/var/lib/rustnies/client.key"

# IPC socket the daemon listens on; `status`/`stop`/`ping` target this path.
ipc_path = "/run/rustnies/rustnies.sock"

# RUST_LOG-style filter.
log_level = "info"
# log_level = "debug"
# log_level = "rustnies::tunnel=debug,rustnies::fec=trace"
# Optional: also write logs to this file (append mode). The parent directory
# is created if it does not exist; if the file cannot be opened, logging
# falls back to stdout-only.
# log_file = "/var/log/rustnies/client.log"

[tun]
name = "rustnies0"
addr = "10.7.0.2"
prefix = 24
mtu = 1400

# Route all traffic through the tunnel (replaces the default route; a host
# route to the server via the original gateway is added first to avoid loops).
# route_all = true
# Keep retrying after a disconnect (exponential backoff).
# reconnect = true
# Block DNS from leaking out the real interface and rewrite /etc/resolv.conf.
# dns_leak_protection = true
# Resolver IPs written to /etc/resolv.conf while the tunnel is up.
# dns = ["1.1.1.1"]
# Fail closed: block all non-tunnel traffic if the tunnel drops.
# kill_switch = false

# ---------------------------------------------------------------------------
# Protocol profile — which implementation of each swappable part a session
# runs. See doc/profiles.md. Omitting this section entirely is equivalent to the
# defaults shown here, which is the pre-negotiation protocol.
# ---------------------------------------------------------------------------

[handshake]
# Key exchange. Must be named identically in the server's and the client's
# config: it carries the profile negotiation, so it cannot itself be negotiated.
# An unknown name is a hard error, not a fallback.
kex = "noise-ik"
# Advertise this client's capabilities in message 1 so the server can pick
# something both ends support. Off by default because appending a payload to
# message 1 is a wire change an older server cannot parse — turn it on only when
# the server is also new. The server's answer needs no such opt-in.
propose = false

[crypto]
# Ordered preference list of per-packet AEAD ciphers; the first entry is the
# default. The chosen suite is negotiated and bound into the transport keys.
aead = ["chacha20poly1305"]

[transport]
# Envelope for the handshake messages. Must match the server's `handshake`.
handshake = "plain"
# Envelope for steady-state frames, as an ordered preference. "same-as-handshake"
# reuses the handshake envelope. The framing tag is server-side only: it travels
# inside the negotiation answer, so do not set it here.
data = ["same-as-handshake"]

[fec]
# Erasure code, as an ordered preference. The actual k/m come from the server's
# packets, so the values below only apply if this client is the one sending data
# with FEC. "none" disables parity entirely.
scheme = ["reed-solomon"]
k = 1
min_m = 0
max_m = 4
initial_m = 2

[congestion]
# Purely local (a congestion window is invisible to the peer). "none" disables
# rate limiting; that is right on a LAN and wrong on a shared or lossy path.
algorithm = "tcp-reno"
