# rustnies server configuration.
#
# Installed by scripts/install.sh (stock copy refreshed to *.toml.dist).
# Every field is optional: CLI flags override these, and a missing default
# config file is ignored entirely. Edit this file, then (re)start the service.

# UDP address to listen on for client handshakes and tunnel traffic.
listen = "0.0.0.0:46722"

# Server long-term static key (created by `keygen` if absent).
key_path = "/var/lib/rustnies/server.key"

# IPC socket the daemon listens on; `status`/`stop`/`ping` target this path.
ipc_path = "/run/rustnies/rustnies.sock"

# RUST_LOG-style filter (e.g. "info", "debug", "rustnies::tunnel=trace").
log_level = "info"
# log_level = "debug"
# log_level = "rustnies::tunnel=debug,rustnies::fec=trace"
# Optional: also write logs to this file (append mode). The parent directory
# is created if it does not exist; if the file cannot be opened, logging
# falls back to stdout-only.
# log_file = "/var/log/rustnies/server.log"

[tun]
name = "rustnies"
addr = "10.7.0.1"
prefix = 24
mtu = 1400

[nat]
# Masquerade tunneled traffic out of the host's real interface.
enabled = true
# out_iface = "eth0"   # auto-detected when unset

# Restrict handshakes to known client public keys. With no [[peers]] section
# the server accepts every peer (open mode). To lock it down, list the hex
# public keys produced by `rustnies keygen --key <client.key>` on each client:
#
# [[peers]]
# public_key = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
# name = "alice"

# ---------------------------------------------------------------------------
# Protocol profile — which implementation of each swappable part a session
# runs. See doc/profiles.md. Omitting this section entirely is equivalent to the
# defaults shown here, which is the pre-negotiation protocol.
# ---------------------------------------------------------------------------

[handshake]
# Key exchange. Must be named identically in the server's and the client's
# config: it carries the profile negotiation, so it cannot itself be negotiated.
# An unknown name is a hard error, not a fallback.
kex = "noise-ik"

[crypto]
# Ordered preference list of per-packet AEAD ciphers; the first entry is the
# default and the rest are fallbacks for a mixed-version fleet. The chosen suite
# is negotiated and is bound into the transport-key derivation.
aead = ["chacha20poly1305"]

[transport]
# Envelope for the handshake messages. Also must match on both peers.
handshake = "plain"
# Envelope for steady-state frames, as an ordered preference. "same-as-handshake"
# reuses the handshake envelope and needs no negotiation at all.
data = ["same-as-handshake"]
# Two-byte framing tag for the "tagged" data envelope, as 4 hex digits. This is
# a server-side setting: the tag travels inside the negotiation answer, so a
# client never has to configure one. It does not affect the handshake envelope.
# tag_hex = "abcd"

[fec]
# Erasure code, as an ordered preference. "none" disables parity entirely.
scheme = ["reed-solomon"]
# How much parity to send — a local sender policy, not negotiated.
k = 1
min_m = 0
max_m = 4
initial_m = 2

[congestion]
# Purely local (a congestion window is invisible to the peer). "none" disables
# rate limiting; that is right on a LAN and wrong on a shared or lossy path.
algorithm = "tcp-reno"
